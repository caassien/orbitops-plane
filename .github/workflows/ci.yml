name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          # Match the toolchain used to format and generate this module's interfaces.
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '0.10.14+7d59c7ec9'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Check toolchain
        run: moon version --all

      - name: Refresh MoonBit registry
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check generated interfaces
        run: |
          moon info
          git diff --exit-code

      - name: Check all backends
        run: moon check --target all --deny-warn

      - name: Build all backends
        run: moon build --target all --deny-warn

      - name: Test all backends
        run: moon test --target all --deny-warn
